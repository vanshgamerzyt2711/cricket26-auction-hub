name: Inspect legacy in-app updater methods

on:
  push:
    paths:
      - '.github/workflows/inspect-app-update-methods.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Extract and inspect V4 assembly update logic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'app.zip'
          Invoke-WebRequest -Uri 'https://github.com/vanshgamerzyt2711/cricket26-auction-hub/releases/download/v4.0.1/Cricket26AuctionHub-win-x64.zip' -OutFile $zip
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($digest -ne 'a9cac4cb748df508ef35fa1527a56e8d108de331339fef931d088d5067a7a202'){throw 'Payload digest mismatch'}
          $dst=Join-Path $env:RUNNER_TEMP 'app'
          Expand-Archive -LiteralPath $zip -DestinationPath $dst
          $exe=Join-Path $dst 'Cricket26AuctionManager.exe'
          dotnet tool install -g ilspycmd
          if($LASTEXITCODE -ne 0){ throw 'ILSpy installation failed' }
          $out=Join-Path $env:RUNNER_TEMP 'decompiled'
          New-Item -ItemType Directory -Force $out | Out-Null
          ilspycmd $exe -o $out
          if($LASTEXITCODE -ne 0){throw 'Decompilation failed'}
          $matches=Get-ChildItem $out -Recurse -File -Include '*.cs' | Select-String -Pattern 'update-manifest','releases/latest','Update & Restart','CheckForUpdate','CheckForUpdates','CurrentVersion','LatestVersion','AppVersion','ReleaseVersion','Cricket26AuctionHub-update','public-release.json'
          Write-Host "Found $($matches.Count) update-related source lines"
          foreach($m in $matches | Select-Object -First 95){
            $line=$m.Line.Trim()
            Write-Host "MATCH $($m.Path.Substring($out.Length)):$($m.LineNumber): $($line.Substring(0,[Math]::Min($line.Length,230)))"
          }
          Write-Host 'Assembly attributes mentioning version:'
          Get-ChildItem $out -Recurse -File -Include '*AssemblyInfo*.cs' | Select-String -Pattern 'AssemblyVersion|AssemblyFileVersion' | Select-Object -First 10 | ForEach-Object { Write-Host $_.Line }
