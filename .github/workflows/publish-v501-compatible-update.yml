name: Build V5.0.1 compatible automatic updater

on:
  push:
    paths:
      - '.github/workflows/publish-v501-compatible-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v4

      - name: Install approved Windows packaging tool
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build and test V4 to V5.0.1 verified update
        shell: pwsh
        run: |
          & './tools/BuildV501.ps1'
          if (!$?) { throw 'Build and upgrade simulation failed.' }

      - name: Create checked draft release and upload complete assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v5.0.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'v5.0.1 already exists. Do not overwrite a published release.'
          }
          @'
          # V5.0.1 — Automatic update compatibility for V4 users

          This release restores automatic updates from the legacy V4.0.0/V4.0.1 updater by providing the required verified FULL ZIP and delta-update manifest/ZIP alongside an offline Inno Setup installer.

          - V4 app startup checks GitHub for a newer version; the normal **Update & Restart** flow can offer V5.0.1 automatically.
          - Existing installed app files are replaced in place after SHA-256 verification, with original updater rollback behavior.
          - App data stays in the established per-user UserData folder; do not delete your game data.
          - The desktop shortcut is supplied by the offline installer. Legacy in-place updater does not create a new shortcut.
          - Full ZIP fallback is available if the small patch cannot be applied.
          - The main application is identical in gameplay functionality to V4.0.1. Its .NET assembly/app release version is now 5.0.1, avoiding repeated update prompts.
          - The offline installer installs separately and should NOT be run on top of an existing working V4 install just to check updates.

          **Security:** These are original V4.0.1 application components with corrected version metadata and newly packaged release artifacts, NOT a security audit or malware removal. Inno Setup antivirus scan results do not guarantee the bundled executable is safe. Don't disable antivirus to install this release.

          **Upgrade validation:** Built against SHA-256 pinned V4.0.1; all old files checked against original release manifest. Delta apply simulation verified all resulting target file hashes; release ZIP files and metadata checked. Real UI testing on a V4 machine is still recommended before broad rollout.
          '@ | Set-Content -Path 'V501-RELEASE-NOTES.md' -Encoding utf8

          gh release create v5.0.1 'Output/Cricket26AuctionHub-Setup.exe' 'Output/Cricket26AuctionHub-win-x64.zip' 'Output/Cricket26AuctionHub-update-win-x64.zip' 'Output/Cricket26AuctionHub-update-manifest.json' 'Output/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --title 'V5.0.1 — Automatic Upgrade for V4 + Offline Installer' --notes-file 'V501-RELEASE-NOTES.md' --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }

          $count = gh release view v5.0.1 --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets | length'
          if ($LASTEXITCODE -ne 0 -or [int]$count -ne 5) {
            throw "Release asset count mismatch (wanted 5, got $count). Keeping draft."
          }
          gh release edit v5.0.1 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing verified V5.0.1 release failed.' }

      - name: Verify public release has required updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/$env:GITHUB_REPOSITORY/releases/tags/v5.0.1 | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'V5.0.1 not stable.' }
          foreach ($name in @('Cricket26AuctionHub-win-x64.zip','Cricket26AuctionHub-update-win-x64.zip','Cricket26AuctionHub-update-manifest.json','Cricket26AuctionHub-Setup.exe','SHA256SUMS.txt')) {
            if (!($release.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })) {
              throw "Release missing verified asset: $name"
            }
          }
          Write-Host "SUCCESS: stable release $($release.html_url) contains all legacy-compatible assets."
