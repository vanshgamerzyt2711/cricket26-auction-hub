name: Inspect Auction Hub UI implementation
on:
  push:
    paths:
      - '.github/workflows/inspect-ui.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read verified UI implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'app.zip'
          Invoke-WebRequest 'https://github.com/vanshgamerzyt2711/cricket26-auction-hub/releases/download/v5.0.1/Cricket26AuctionHub-win-x64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2acd17c4c0c39f617b7c6fc6cea8457641e96576cdbbd7a0cd7575e3e818dd84') { throw 'untrusted app zip' }
          $dir = Join-Path $env:RUNNER_TEMP 'app'
          Expand-Archive -Path $zip -DestinationPath $dir
          dotnet tool install -g ilspycmd
          $out = Join-Path $env:RUNNER_TEMP 'decomp'
          New-Item -ItemType Directory -Force $out | Out-Null
          ilspycmd (Join-Path $dir 'Cricket26AuctionManager.exe') -o $out
          $file=Get-ChildItem $out -File -Filter '*.cs' | Select-Object -First 1
          $lines = Get-Content $file.FullName
          Write-Host "DECOMPILED_LINES=$($lines.Count)"
          $patterns='Color bg','Color panel','Color accent','AuctionManager\(','BuildUI\(','BuildUi\(','Navigate\(','RefreshProfiles\(','DoubleBuffered','CreateParams','private .* Build','private .* Panel','private .* Action\(','private .* Label\(','private .* Font','SetStyle\(','public AuctionManager\('
          foreach($pat in $patterns){
            $hits = @(Select-String -LiteralPath $file.FullName -Pattern $pat | Select-Object -First 15)
            Write-Host "PATTERN [$pat] countListed=$($hits.Count)"
            foreach($hit in $hits){ Write-Host ("HIT{0}: {1}" -f $hit.LineNumber,$hit.Line.Trim().Substring(0,[Math]::Min(240,$hit.Line.Trim().Length))) }
          }
          foreach($pattern in @('public AuctionManager\(', 'private .*Navigate\(', 'private .*Build.*\(', 'private .*Action\(', 'private .*RefreshProfiles\(', 'private .*Run\(')){
            $match=Select-String -LiteralPath $file.FullName -Pattern $pattern | Select-Object -First 1
            if($match){
              Write-Host "EXCERPT[$pattern] starting $($match.LineNumber)"
              $last=[Math]::Min($lines.Count,$match.LineNumber+95)
              for($i=$match.LineNumber;$i -le $last;$i++){
                $line=$lines[$i-1]
                Write-Host ("L{0}: {1}" -f $i,$line.Substring(0,[Math]::Min(330,$line.Length)))
              }
            }
          }
          $asm = [System.Reflection.AssemblyName]::GetAssemblyName((Join-Path $dir 'Cricket26AuctionManager.exe'))
          Write-Host "ASSEMBLY: $($asm.Name) version=$($asm.Version) framework info="
