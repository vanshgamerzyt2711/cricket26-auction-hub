name: Inspect legacy updater manifest

on:
  push:
    paths:
      - '.github/workflows/inspect-updater-manifest.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Inspect V4.0.1 update manifest schema
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/vanshgamerzyt2711/cricket26-auction-hub/releases/download/v4.0.1/Cricket26AuctionHub-update-manifest.json'
          $path = Join-Path $env:RUNNER_TEMP 'manifest.json'
          Invoke-WebRequest -Uri $url -OutFile $path
          $text = Get-Content -LiteralPath $path -Raw
          $json = $text | ConvertFrom-Json -Depth 70
          Write-Host "Top level keys:"
          $json.PSObject.Properties | ForEach-Object { Write-Host "  $($_.Name) [$($_.Value.GetType().Name)]" }
          Write-Host "Version-like fields:"
          $json.PSObject.Properties | Where-Object { $_.Name -match 'version|tag|url|asset|build|release|schema|patch|full' } | ForEach-Object {
            $val=$_.Value
            if ($val -is [string]) { Write-Host "  $($_.Name)=$val" }
            elseif ($null -ne $val) {
              Write-Host "  $($_.Name) type=$($val.GetType().Name)"
              if ($val -is [pscustomobject]) {
                $val.PSObject.Properties | ForEach-Object {
                  if ($_.Value -is [string]) { Write-Host "      $($_.Name)=$($_.Value)" }
                  else { Write-Host "      $($_.Name): $($_.Value.GetType().Name)" }
                }
              }
            }
          }
          Write-Host "First 1200 characters of public manifest:"
          Write-Host $text.Substring(0,[Math]::Min(1200,$text.Length))
