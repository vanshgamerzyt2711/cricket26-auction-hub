name: Inspect update badge integration
on:
  push:
    paths:
      - '.github/workflows/inspect-update-badge.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Decompile V5.0.1 updater and logo area
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'app.zip'
          Invoke-WebRequest 'https://github.com/vanshgamerzyt2711/cricket26-auction-hub/releases/download/v5.0.1/Cricket26AuctionHub-win-x64.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2acd17c4c0c39f617b7c6fc6cea8457641e96576cdbbd7a0cd7575e3e818dd84'){throw 'hash mismatch'}
          $dir=Join-Path $env:RUNNER_TEMP 'app'
          Expand-Archive $zip $dir
          dotnet tool install -g ilspycmd
          $d=Join-Path $env:RUNNER_TEMP 'src'
          New-Item -ItemType Directory $d -Force|Out-Null
          ilspycmd (Join-Path $dir 'Cricket26AuctionManager.exe') -o $d
          $f=Get-ChildItem $d -Filter '*.cs'|Select-Object -First 1
          $lines=Get-Content $f.FullName
          foreach($pattern in @('OpenUpdates\(','InitializeUpdateNotifications\(','RememberUpdate\(','RunUpdate','UpdateAvailable','StartWithUpdates','ShowUpdate','CheckUpdates','OnUpdate','Logo','logo','updateBanner','updateBadge','UpdateNow')){
            Write-Host "METHOD PATTERN $pattern"
            Select-String -Path $f.FullName -Pattern $pattern | Select-Object -First 16 | ForEach-Object {Write-Host "MATCH $($_.LineNumber): $($_.Line.Trim().Substring(0,[Math]::Min(200,$_.Line.Trim().Length)))"}
          }
          $ranges=@(@(185,335),@(1920,2065),@(2180,2335))
          foreach($pat in @('private void InitializeUpdateNotifications\(','private void RememberUpdate\(','private void OpenUpdates\(')){
            $found=Select-String -Path $f.FullName -Pattern $pat|Select-Object -First 1
            if($found){$ranges+=,@($found.LineNumber,[Math]::Min($found.LineNumber+180,$lines.Count))}
          }
          foreach($range in $ranges){
            Write-Host "EXCERPT $($range[0])-$($range[1])"
            foreach($i in $range[0]..$range[1]){
              if($i -gt $lines.Count){break}
              $s=$lines[$i-1]; Write-Host ('CODE{0}: {1}' -f $i,$s.Substring(0,[Math]::Min(300,$s.Length)))
            }
          }
